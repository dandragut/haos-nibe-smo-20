views:
  - type: sections
    cards: []
    title: House fluids (water)
    icon: mdi:heat-pump-outline
    sections:
      - type: grid
        cards:
          - type: entities
            entities:
              - entity: sensor.smo_20_ams_20_10_outdoor_temperature
                secondary_info: last-updated
            state_color: true
            show_header_toggle: false
          - type: entities
            entities:
              - entity: >-
                  number.smo_20_ams_20_10_room_sensor_set_point_value_heating_climate_system_1
                type: custom:numberbox-card
                secondary_info: last-updated
              - entity: sensor.smo_20_ams_20_10_room_temperature_bt50
                secondary_info: last-updated
              - entity: number.smo_20_ams_20_10_offset
                type: custom:numberbox-card
                icon: mdi:temperature-celsius
            state_color: true
            show_header_toggle: false
          - type: entities
            entities:
              - entity: sensor.smo_20_ams_20_10_hot_water_top_bt7
                name: Hot water top (BT14)
                secondary_info: last-updated
              - entity: sensor.smo_20_ams_20_10_hot_water_charging_bt6
                name: Hot water bottom (BT6)
                secondary_info: last-updated
              - entity: select.smo_20_ams_20_10_hot_water_boost
                secondary_info: none
            state_color: true
            show_header_toggle: false
          - type: history-graph
            entities:
              - entity: sensor.smo_20_ams_20_10_hot_water_top_bt7
                name: Hot water top (BT7)
              - entity: sensor.smo_20_ams_20_10_hot_water_charging_bt6
            refresh_interval: 0
            logarithmic_scale: false
            hours_to_show: 8
          - type: gauge
            entity: sensor.smo_20_ams_20_10_hot_water_charging_bt6
            min: 31
            severity:
              green: 36
              yellow: 40
              red: 44
            needle: true
            grid_options:
              columns: 6
              rows: auto
            max: 55
          - type: gauge
            entity: sensor.smo_20_ams_20_10_high_pressure_sensor_eb101_bp4
            unit: bar
            min: 0
            max: 35
            severity:
              green: 15
              yellow: 24
              red: 29
            needle: true
            grid_options:
              columns: 6
              rows: auto
      - type: grid
        cards:
          - type: entities
            entities:
              - entity: sensor.smo_20_ams_20_10_current_compressor_frequency_eb101
                secondary_info: last-changed
              - entity: sensor.smo_20_ams_20_10_heating_medium_pump_speed_gp1
                secondary_info: last-changed
            state_color: true
            show_header_toggle: false
          - type: history-graph
            entities:
              - entity: binary_sensor.smo_20_ams_20_10_defrosting_eb101_ep14_binary
              - entity: binary_sensor.smo_20_add_heat_in_tank
            hours_to_show: 24
            grid_options:
              columns: full
            logarithmic_scale: false
          - type: history-graph
            entities:
              - entity: sensor.smo_20_ams_20_10_heating_medium_pump_speed_gp1
                name: Heating pump speed (GP1)
              - entity: sensor.smo_20_ams_20_10_current_compressor_frequency_eb101
                name: Compressor frequency
              - entity: sensor.smo_20_ams_20_10_requested_compressor_freq_eb101
              - entity: sensor.smo_20_ams_20_10_status_compressor_eb101
                name: Compressor status
              - entity: sensor.smo_20_ams_20_10_defrosting_eb101_ep14
            refresh_interval: 0
            hours_to_show: 6
            grid_options:
              columns: full
            logarithmic_scale: false
      - type: grid
        cards:
          - type: entities
            entities:
              - entity: number.smo_20_ams_20_10_current_value
                secondary_info: last-updated
                name: Current value (DM)
          - type: entities
            entities:
              - entity: sensor.smo_20_ams_20_10_supply_line_eb101_bt12
                secondary_info: none
              - entity: sensor.smo_20_ams_20_10_return_line_eb101_bt3
                secondary_info: none
              - entity: sensor.flow_delta_temp_bt12_minus_bt3
                secondary_info: none
          - type: entities
            entities:
              - entity: sensor.smo_20_ams_20_10_discharge_eb101_bt14
                name: Discharge (BT14)
                secondary_info: none
              - entity: sensor.smo_20_ams_20_10_high_pressure_sensor_eb101_bp4
                secondary_info: none
            state_color: true
            show_header_toggle: false
          - type: history-graph
            entities:
              - entity: sensor.smo_20_ams_20_10_supply_line_eb101_bt12
              - entity: sensor.smo_20_ams_20_10_return_line_eb101_bt3
                name: Return line (BT3)
              - entity: sensor.smo_20_ams_20_10_calculated_supply_climate_system_1
              - entity: sensor.smo_20_ams_20_10_discharge_eb101_bt14
            refresh_interval: 0
            hours_to_show: 3
            grid_options:
              columns: full
              rows: 4
            logarithmic_scale: false
            fit_y_data: true
            min_y_axis: 20
            max_y_axis: 50
          - type: history-graph
            entities:
              - entity: sensor.smo_20_ams_20_10_high_pressure_sensor_eb101_bp4
            refresh_interval: 0
            hours_to_show: 3
            grid_options:
              columns: full
              rows: 4
            logarithmic_scale: false
            max_y_axis: 40
            min_y_axis: 0
      - type: grid
        cards:
          - type: entities
            entities:
              - entity: sensor.smo_20_ams_20_10_calculated_supply_climate_system_1
                secondary_info: last-updated
                name: Calculated supply temperature
          - type: entities
            entities:
              - entity: sensor.smo_20_ams_20_10_external_supply_line_bt25
                secondary_info: none
              - entity: sensor.smo_20_ams_20_10_external_return_line_bt71
                secondary_info: none
              - entity: sensor.flow_delta_temp_bt25_minus_bt71
                secondary_info: last-updated
          - type: history-graph
            entities:
              - entity: sensor.smo_20_ams_20_10_external_supply_line_bt25
              - entity: sensor.smo_20_ams_20_10_external_return_line_bt71
              - entity: sensor.smo_20_ams_20_10_calculated_supply_climate_system_1
              - entity: sensor.smo_20_ams_20_10_outdoor_temperature
            refresh_interval: 0
            hours_to_show: 4
            grid_options:
              columns: full
              rows: 6
            logarithmic_scale: false
            fit_y_data: true
          - type: history-graph
            entities:
              - entity: number.smo_20_ams_20_10_current_value
                name: Current value (DM)
            refresh_interval: 0
            hours_to_show: 5
            grid_options:
              columns: full
            logarithmic_scale: false
    header:
      layout: responsive
      badges_position: bottom
      badges_wrap: wrap
    max_columns: 4
  - type: sections
    path: pdc-24h
    max_columns: 4
    title: Historic
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 1 day
            heading_style: title
          - type: history-graph
            entities:
              - entity: sensor.smo_20_ams_20_10_calculated_supply_climate_system_1
              - entity: sensor.smo_20_ams_20_10_supply_line_eb101_bt12
              - entity: sensor.smo_20_ams_20_10_external_return_line_bt71
              - entity: sensor.smo_20_ams_20_10_external_supply_line_bt25
            refresh_interval: 0
            hours_to_show: 24
            grid_options:
              columns: full
              rows: 6
            logarithmic_scale: false
            title: Heating
          - type: history-graph
            entities:
              - entity: sensor.smo_20_ams_20_10_supply_line_eb101_bt12
              - entity: sensor.smo_20_ams_20_10_return_line_eb101_bt3
              - entity: sensor.smo_20_ams_20_10_discharge_eb101_bt14
              - entity: sensor.smo_20_ams_20_10_hot_water_charging_bt6
            refresh_interval: 0
            hours_to_show: 24
            grid_options:
              columns: full
              rows: 6
            logarithmic_scale: false
            title: Hot water
          - type: history-graph
            entities:
              - entity: binary_sensor.smo_20_add_heat_in_tank
                name: Additional heat
              - entity: sensor.smo_20_ams_20_10_defrosting_eb101_ep14
            hours_to_show: 24
            grid_options:
              columns: full
            logarithmic_scale: false
          - type: history-graph
            entities:
              - entity: number.smo_20_ams_20_10_current_value
                name: Current value (DM)
              - entity: sensor.smo_20_ams_20_10_heating_medium_pump_speed_gp1
                name: Heating pump speed (GP1)
              - entity: sensor.smo_20_ams_20_10_current_compressor_frequency_eb101
                name: Compressor frequency
              - entity: sensor.smo_20_ams_20_10_status_compressor_eb101
                name: Compressor status
              - entity: sensor.smo_20_ams_20_10_defrosting_eb101_ep14
            refresh_interval: 0
            hours_to_show: 24
            grid_options:
              columns: full
            logarithmic_scale: false
          - type: history-graph
            entities:
              - entity: sensor.smo_20_ams_20_10_high_pressure_sensor_eb101_bp4
              - entity: sensor.smo_20_ams_20_10_requested_compressor_freq_eb101
              - entity: sensor.smo_20_ams_20_10_current_compressor_frequency_eb101
            refresh_interval: 0
            hours_to_show: 24
            grid_options:
              columns: full
              rows: 8
            logarithmic_scale: false
            title: Compressor
          - type: history-graph
            entities:
              - entity: sensor.smo_20_ams_20_10_hot_water_charging_bt6
              - entity: sensor.smo_20_ams_20_10_hot_water_top_bt7
            refresh_interval: 0
            hours_to_show: 24
            grid_options:
              columns: full
              rows: 6
            logarithmic_scale: false
            title: Hot water
        column_span: 2
      - type: grid
        cards:
          - type: heading
            heading_style: title
          - type: history-graph
            entities:
              - entity: binary_sensor.smo_20_add_heat_in_tank
                name: Additional heat
            hours_to_show: 72
            grid_options:
              columns: full
            logarithmic_scale: false
          - type: history-graph
            entities:
              - entity: number.smo_20_ams_20_10_current_value
                name: Current value (DM)
              - entity: sensor.smo_20_ams_20_10_heating_medium_pump_speed_gp1
                name: Heating pump speed (GP1)
              - entity: sensor.smo_20_ams_20_10_current_compressor_frequency_eb101
                name: Compressor frequency
              - entity: sensor.smo_20_ams_20_10_status_compressor_eb101
                name: Compressor status
            refresh_interval: 0
            hours_to_show: 72
            grid_options:
              columns: full
            logarithmic_scale: false
        column_span: 2
    cards: []
    header:
      layout: responsive
      badges_position: bottom
      badges_wrap: wrap
  - title: Nibe SMO 20 + AMS 20-10
    sections:
      - type: grid
        cards:
          - type: entities
            entities:
              - entity: sensor.smo_20_ams_20_10_outdoor_temperature
                secondary_info: last-updated
                name: Outdoor °C
              - entity: sensor.smo_20_ams_20_10_outd_temperature_eb101_bt28
                secondary_info: last-updated
                name: Outdoor °C - Pump sensor (BT28)
            title: Outside
            grid_options:
              columns: 16
              rows: auto
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_outd_temperature_eb101_bt28
            detail: 2
            grid_options:
              columns: 6
              rows: 2
            name: Outdoor °C - Pump sensor (B428)
            hours_to_show: 12
          - type: entities
            entities:
              - entity: sensor.smo_20_ams_20_10_room_temperature_bt50
                secondary_info: last-updated
                name: Room °C (BT50)
              - entity: >-
                  number.smo_20_ams_20_10_room_sensor_set_point_value_heating_climate_system_1
                secondary_info: last-updated
                name: Room °C - Set point value
            title: Inside
            grid_options:
              columns: 17
              rows: auto
          - type: entities
            entities:
              - entity: sensor.smo_20_ams_20_10_hot_water_top_bt7
                secondary_info: last-updated
                name: Hot water top (BT7)
              - entity: sensor.smo_20_ams_20_10_hot_water_charging_bt6
                secondary_info: last-updated
                name: Hot water bottom (BT6)
            title: Hot water
            grid_options:
              columns: 17
              rows: auto
            show_header_toggle: true
            state_color: true
          - type: markdown
            content: |-
              ```
              Economic: 30°C <= BT6  <= 35°C
              Normal  : 35°C <= BT6  <= 38°C
              Lux     : 41°C <= BT6  <= 45°C
              Oprire  : 55°C
              ```
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_hot_water_charging_bt6
            detail: 1
            name: Hot water botom (BT6)
            grid_options:
              columns: 6
              rows: 2
            hours_to_show: 1
          - type: custom:mini-graph-card
            name: Analiză Presiune vs. Debit
            hours_to_show: 12
            points_per_hour: 6
            line_width: 2
            entities:
              - entity: sensor.nibe_bt25_external_supply_21123
                name: Tur Real (BT25)
                color: '#ff5e57'
              - entity: sensor.nibe_bt25_external_supply_21123_calculated
                name: Tur Calculat
                color: '#ffdd59'
              - entity: sensor.nibe_bp4_pressure_21123
                name: Presiune Freon (BP4)
                color: '#00d2d3'
                y_axis: secondary
              - entity: sensor.nibe_gp1_pump_speed_21123
                name: Viteza Pompa (GP1)
                color: '#1dd1a1'
                y_axis: secondary
            show:
              fill: fade
              labels: true
              labels_secondary: true
          - type: custom:mini-graph-card
            name: Analiză Presiune vs. Debit
            hours_to_show: 12
            points_per_hour: 6
            line_width: 2
            entities:
              - entity: sensor.nibe_bt25_external_supply_21123
                name: Tur Real (BT25)
                color: '#ff5e57'
              - entity: sensor.nibe_bt25_external_supply_21123_calculated
                name: Tur Calculat
                color: '#ffdd59'
              - entity: sensor.nibe_bp4_pressure_21123
                name: Presiune Freon (BP4)
                color: '#00d2d3'
                y_axis: secondary
              - entity: sensor.nibe_gp1_pump_speed_21123
                name: Viteza Pompa (GP1)
                color: '#1dd1a1'
                y_axis: secondary
            show:
              fill: fade
              labels: true
              labels_secondary: true
          - type: custom:mini-graph-card
            name: Analiză Presiune vs. Debit
            hours_to_show: 12
            points_per_hour: 6
            line_width: 2
            entities:
              - entity: sensor.nibe_bt25_external_supply_21123
                name: Tur Real (BT25)
                color: '#ff5e57'
              - entity: sensor.nibe_bt25_external_supply_21123_calculated
                name: Tur Calculat
                color: '#ffdd59'
              - entity: sensor.nibe_bp4_pressure_21123
                name: Presiune Freon (BP4)
                color: '#00d2d3'
                y_axis: secondary
              - entity: sensor.nibe_gp1_pump_speed_21123
                name: Viteza Pompa (GP1)
                color: '#1dd1a1'
                y_axis: secondary
            show:
              fill: fade
              labels: true
              labels_secondary: true
        column_span: 2
      - type: grid
        cards:
          - type: heading
            heading: Compressor
            heading_style: title
          - type: tile
            entity: number.smo_20_ams_20_10_offset
            name: Curve offset
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
          - graph: line
            type: sensor
            entity: number.smo_20_ams_20_10_current_value
            grid_options:
              columns: 10
              rows: 2
            detail: 1
            name: Current value
            hours_to_show: 3
            icon: mdi:metronome
          - type: entities
            entities:
              - entity: sensor.smo_20_status_compressor_text
                name: Compressort status
                secondary_info: last-updated
              - entity: sensor.smo_20_ams_20_10_current_compressor_frequency_eb101
                name: Current compressor frequency
                secondary_info: last-updated
              - entity: sensor.smo_20_ams_20_10_requested_compressor_freq_eb101
                name: Requested compressor frequency
                secondary_info: last-updated
              - entity: number.smo_20_ams_20_10_change_in_curve
                secondary_info: last-updated
              - entity: number.smo_20_ams_20_10_offset
            title: Compressor
            grid_options:
              columns: 18
              rows: auto
          - type: history-graph
            entities:
              - entity: sensor.smo_20_ams_20_10_current_compressor_frequency_eb101
                name: Compressor frequency history
            hours_to_show: 24
            refresh_interval: 0
            grid_options:
              columns: full
          - type: history-graph
            entities:
              - entity: sensor.smo_20_ams_20_10_status_compressor_eb101
                name: Compressor status history
            hours_to_show: 24
            grid_options:
              columns: full
          - type: markdown
            content: '-------'
            text_only: true
          - type: history-graph
            entities:
              - entity: binary_sensor.smo_20_add_heat_in_tank
                name: .
            hours_to_show: 24
            grid_options:
              columns: full
            logarithmic_scale: false
            title: Additional heat in tank
          - type: history-graph
            entities:
              - entity: number.smo_20_ams_20_10_current_value
                name: DM
            hours_to_show: 24
            grid_options:
              columns: full
              rows: 4
        column_span: 2
      - type: grid
        cards:
          - type: heading
            heading: House fluids (water)
            heading_style: title
          - type: entities
            entities:
              - entity: sensor.smo_20_ams_20_10_supply_line_eb101_bt12
                name: Supply line (BT12)
                secondary_info: last-updated
              - entity: sensor.smo_20_ams_20_10_return_line_eb101_bt3
              - entity: number.flow_delta_temp_bt12_minus_bt3
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_calculated_supply_climate_system_1
            grid_options:
              columns: full
            detail: 2
            hours_to_show: 1
            name: Calculated supply climate system
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_supply_line_eb101_bt12
            detail: 1
            name: Supply line (BT12)
            grid_options:
              columns: full
            hours_to_show: 1
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_return_line_eb101_bt3
            grid_options:
              columns: full
            detail: 2
            hours_to_show: 1
            name: Return line (BT3)
          - graph: line
            type: sensor
            entity: number.flow_delta_temp_bt12_minus_bt3
            grid_options:
              columns: full
            detail: 1
            name: Delta T (BT12 minus BT3)
            hours_to_show: 1
          - graph: line
            entity: sensor.smo_20_ams_20_10_heating_medium_pump_speed_gp1
            name: Pump speed (GP1)
            type: sensor
            grid_options:
              columns: full
            detail: 2
            hours_to_show: 1
          - type: history-graph
            entities:
              - entity: binary_sensor.smo_20_ams_20_10_charge_pump_gp12
                name: Pump (GP12)
            hours_to_show: 24
            grid_options:
              columns: full
            logarithmic_scale: false
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_external_supply_line_bt25
            grid_options:
              columns: full
            detail: 2
            hours_to_show: 1
            name: External supply line (BT25)
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_external_return_line_bt71
            grid_options:
              columns: full
            detail: 2
            name: External return line (BT71)
            hours_to_show: 1
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: 'Machine Side: Gasses (Hot & High Pressure)'
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_discharge_eb101_bt14
            detail: 1
            grid_options:
              columns: full
              rows: 2
            hours_to_show: 1
            name: Discharge (BT14)
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_suction_gas_eb101_bt17
            grid_options:
              columns: full
            detail: 1
            hours_to_show: 1
            name: Suction gas (BT17)
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_high_pressure_sensor_eb101_bp4
            grid_options:
              columns: full
            detail: 1
            name: High pressure sensor (BP4)
            hours_to_show: 1
          - type: markdown
            content: |-
              High pressure sensor (BP4):
              ```
              Ideal      : 20-25 bar (croaziera)
              Acceptabil : 25-28 bar (sarcina / apa calda)  
              Stres      : 29-31 bar
              Avarie     :  > 32 bar
              ```
      - type: grid
        cards:
          - type: heading
            heading: 'Machine Side: Liquids/Refrigerant'
            heading_style: title
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_liquid_line_eb101_bt15
            grid_options:
              columns: full
            detail: 1
            name: Liquid line (BT15)
            hours_to_show: 1
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_evaporator_eb101_bt16
            detail: 2
            grid_options:
              columns: full
            hours_to_show: 1
            name: Evaporator (BT16)
          - graph: line
            type: sensor
            entity: sensor.smo_20_ams_20_10_low_pressure_eb101_bp8
            name: Low pressure (BP8)
            grid_options:
              columns: full
            detail: 1
            hours_to_show: 24
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: Info
          - show_name: true
            show_icon: true
            show_state: true
            type: glance
            entities:
              - entity: binary_sensor.smo_20_ams_20_10_connectivity
                name: ' '
              - entity: binary_sensor.smo_20_alarm
                name: Alarm?
              - entity: update.smo_20_ams_20_10_firmware
                name: Firmware
            columns: 3
          - show_name: true
            show_icon: true
            show_state: true
            type: glance
            entities:
              - entity: sensor.smo_20_ams_20_10_number_of_starts
                show_last_changed: false
                name: '# starts'
              - entity: sensor.smo_20_ams_20_10_total_operating_time
                name: total hours
              - entity: sensor.smo_20_ams_20_10_of_which_hot_water
                name: hours for water
            state_color: false
          - type: glance
            entities:
              - entity: sensor.smo_20_ams_20_10_defrosting_eb101_ep14
                name: Defrosting?
              - entity: sensor.smo_20_ams_20_10_status_compressor_eb101
                name: Compressor status
          - type: glance
            entities:
              - entity: number.smo_20_ams_20_10_climate_system
                name: Indoor target °C
              - entity: number.smo_20_ams_20_10_offset
                name: Curve Offset
              - entity: number.smo_20_ams_20_10_change_in_curve
                name: Change in curve
          - type: glance
            entities:
              - entity: switch.smo_20_ams_20_10_temporary_lux
                name: Temporary lux
              - entity: select.smo_20_ams_20_10_hot_water_boost
                name: Hot water boost
