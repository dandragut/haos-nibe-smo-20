            hours_to_show: 24
            grid_options:
              columns: full
            logarithmic_scale: false
            title: Additional heat in tank
          - type: history-graph
            entities:
              - entity: number.smo_20_ams_20_10_current_value
                name: DM
            hours_to_show: 24
            grid_options:
              columns: full
              rows: 4
        column_span: 2
      - type: grid
        cards:
          - type: heading
            heading: House fluids (water)
            heading_style: title
          - type: entities
            entities:
              - entity: sensor.smo_20_ams_20_10_supply_line_eb101_bt12
